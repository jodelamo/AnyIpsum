name: SwiftLint

on:
  pull_request:
    paths:
      - ".github/workflows/swiftlint.yml"
      - ".swiftlint.yml"
      - "**/*.swift"

permissions:
  contents: read

concurrency:
  group: swiftlint-${{ github.ref }}
  cancel-in-progress: true

env:
  SWIFTLINT_VERSION: "0.65.1"
  SWIFTLINT_SHA256: "c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0"
  XCODE_VERSION: "16.4"

jobs:
  lint:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install SwiftLint
        run: |
          archive="$RUNNER_TEMP/portable_swiftlint.zip"
          install_dir="$RUNNER_TEMP/swiftlint"
          curl --fail --location --silent --show-error \
            "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip" \
            --output "$archive"
          printf '%s  %s\n' "$SWIFTLINT_SHA256" "$archive" | shasum -a 256 --check
          mkdir -p "$install_dir"
          ditto -x -k "$archive" "$install_dir"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Lint Swift sources
        run: swiftlint lint --strict --reporter github-actions-logging
