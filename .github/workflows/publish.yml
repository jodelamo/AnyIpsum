name: Publish Release

on:
  release:
    types:
      - published

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  XCODE_VERSION: "16.4"

jobs:
  publish:
    runs-on: macos-15
    steps:
      - name: Validate release tag
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Report toolchain
        run: xcodebuild -version

      - name: Build release artifacts
        run: ./scripts/build-release.sh '${{ steps.release.outputs.version }}'

      - name: Verify checksums
        working-directory: dist
        run: shasum -a 256 --check SHA256SUMS

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            dist/AnyIpsum-*.dmg \
            dist/AnyIpsum-*.zip \
            dist/SHA256SUMS \
            --clobber

      - name: Check out Homebrew tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jodelamo/homebrew-anyipsum
          ref: main
          path: ${{ runner.temp }}/homebrew-anyipsum
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Update Homebrew cask
        env:
          TAP_PATH: ${{ runner.temp }}/homebrew-anyipsum
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          dmg_path="dist/AnyIpsum-${VERSION}.dmg"
          cask_path="${TAP_PATH}/Casks/anyipsum.rb"
          checksum="$(shasum -a 256 "$dmg_path")"
          checksum="${checksum%% *}"

          VERSION="$VERSION" SHA256="$checksum" CASK_PATH="$cask_path" ruby <<'RUBY'
          path = ENV.fetch("CASK_PATH")
          contents = File.read(path)
          version = ENV.fetch("VERSION")
          sha256 = ENV.fetch("SHA256")

          unless contents.sub!(/^  version "[^"]+"$/, "  version \"#{version}\"")
            abort "Could not update version in #{path}"
          end

          unless contents.sub!(/^  sha256 "[^"]+"$/, "  sha256 \"#{sha256}\"")
            abort "Could not update sha256 in #{path}"
          end

          File.write(path, contents)
          RUBY

          cd "$TAP_PATH"
          if git diff --quiet -- Casks/anyipsum.rb; then
            echo "Homebrew cask is already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/anyipsum.rb
          git commit -m "chore: update AnyIpsum ${VERSION}"
          git push origin HEAD:main
